<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страницата не е намерена | KirbyPro</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face{font-family:'Montserrat Variable';font-display:swap;font-weight:100 900;src:url(/fonts/montserrat-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Montserrat Variable';font-display:swap;font-weight:100 900;src:url(/fonts/montserrat-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#fff 0%,#EEF6F2 100%);color:#18211C;font-family:"Montserrat Variable",system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"locl" 0;text-align:center}
main{max-width:520px}
.code{font-size:clamp(4rem,12vw,7rem);font-weight:200;line-height:1;color:#148A4F;margin:0}
h1{font-size:1.5rem;font-weight:600;margin:16px 0 10px}
p{color:#56625B;line-height:1.6;margin:0}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:4px;font-weight:600;text-decoration:none}
.primary{background:#148A4F;color:#fff}
.primary:hover{background:#0E7040}
.ghost{border:1.5px solid #18211C;color:#18211C;white-space:nowrap}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Тази страница не съществува</h1>
  <p>Възможно е адресът да е стар или грешен. Всичко за наема на Kirby е на началната страница.</p>
  <div class="actions">
    <a class="primary" href="/">Към началната страница</a>
    <a class="ghost" href="tel:+359896825553">0896 825 553</a>
  </div>
</main>
</body>
</html>
